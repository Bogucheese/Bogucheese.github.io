<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fc5533"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2b3445">满足以下特征的任务，使用 Agent 架构收益最高</text>

  <!-- 卡片 1：开放式复杂问题 -->
  <rect x="40" y="64" width="272" height="244" rx="14" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5"/>
  <circle cx="176" cy="122" r="27" fill="#fff1ec" stroke="#f6c3b2" stroke-width="1.5"/>
  <circle cx="176" cy="122" r="13" fill="none" stroke="#fc5533" stroke-width="2"/>
  <polygon points="0,-8 5,5 0,2 -5,5" transform="translate(176,122) rotate(40)" fill="#fc5533"/>
  <text x="176" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2b3445">开放式复杂问题</text>
  <text x="176" y="208" text-anchor="middle" font-size="11" fill="#5b6472">解决路径不固定，需动态探索、</text>
  <text x="176" y="226" text-anchor="middle" font-size="11" fill="#5b6472">灵活调整，无法预编程固定步骤</text>
  <text x="176" y="258" text-anchor="middle" font-size="10.5" fill="#fc5533">例：行业调研、复杂问题排查</text>

  <!-- 卡片 2：多步骤流程任务 -->
  <rect x="344" y="64" width="272" height="244" rx="14" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5"/>
  <circle cx="480" cy="122" r="27" fill="#fff1ec" stroke="#f6c3b2" stroke-width="1.5"/>
  <path d="M 465 133 H 473 V 125 H 481 V 117 H 489 V 109 H 495" fill="none" stroke="#fc5533" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="480" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2b3445">多步骤流程任务</text>
  <text x="480" y="208" text-anchor="middle" font-size="11" fill="#5b6472">需多轮调用不同工具、跨系统</text>
  <text x="480" y="226" text-anchor="middle" font-size="11" fill="#5b6472">交互，而非单次查询或单步生成</text>
  <text x="480" y="258" text-anchor="middle" font-size="10.5" fill="#fc5533">例：完整业务办理、全链路运维</text>

  <!-- 卡片 3：需持续优化的场景 -->
  <rect x="648" y="64" width="272" height="244" rx="14" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5"/>
  <circle cx="784" cy="122" r="27" fill="#fff1ec" stroke="#f6c3b2" stroke-width="1.5"/>
  <polyline points="771,131 779,123 785,127 797,113" fill="none" stroke="#fc5533" stroke-width="2.5"/>
  <polygon points="797,113 789,114 795,120" fill="#fc5533"/>
  <text x="784" y="180" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2b3445">需持续优化的场景</text>
  <text x="784" y="208" text-anchor="middle" font-size="11" fill="#5b6472">需基于用户反馈与环境变化</text>
  <text x="784" y="226" text-anchor="middle" font-size="11" fill="#5b6472">持续迭代能力，而非固定逻辑</text>
  <text x="784" y="258" text-anchor="middle" font-size="10.5" fill="#fc5533">例：个性化推荐、自适应运营助手</text>
</svg>
