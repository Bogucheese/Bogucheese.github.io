<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9aa5b5"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fc5533"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 交互环境 -->
  <rect x="30" y="130" width="190" height="280" rx="12" fill="#f7f8fa" stroke="#c2cad6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="125" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3445">交互环境</text>
  <text x="125" y="186" text-anchor="middle" font-size="10.5" fill="#8a94a6">外部场域与交互边界</text>
  <rect x="48" y="208" width="154" height="36" rx="8" fill="#ffffff" stroke="#d5dae3"/>
  <text x="125" y="231" text-anchor="middle" font-size="11" fill="#4a5568">机票酒店预订平台</text>
  <rect x="48" y="256" width="154" height="36" rx="8" fill="#ffffff" stroke="#d5dae3"/>
  <text x="125" y="279" text-anchor="middle" font-size="11" fill="#4a5568">用户对话界面</text>

  <!-- 感知输入箭头 -->
  <line x1="220" y1="158" x2="330" y2="158" stroke="#fc5533" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="275" y="144" text-anchor="middle" font-size="10.5" fill="#8a94a6">状态 / 需求</text>

  <!-- 执行输出箭头 -->
  <path d="M 850 206 V 292 H 220" fill="none" stroke="#fc5533" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="540" y="280" text-anchor="middle" font-size="10.5" fill="#8a94a6">动作 / 作用</text>

  <!-- Agent 容器 -->
  <rect x="290" y="50" width="640" height="470" rx="16" fill="#fffaf7" stroke="#fc5533" stroke-width="1.5"/>
  <text x="314" y="86" font-size="15" font-weight="700" fill="#fc5533">AI Agent</text>

  <!-- 感知单元 -->
  <rect x="330" y="110" width="160" height="96" rx="10" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/>
  <text x="410" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3445">感知单元</text>
  <text x="410" y="175" text-anchor="middle" font-size="10.5" fill="#8a94a6">传感器 · 信息输入接口</text>

  <!-- 决策核心 -->
  <rect x="550" y="100" width="180" height="116" rx="12" fill="#fc5533"/>
  <text x="640" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">决策核心</text>
  <text x="640" y="172" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85">LLM · 大脑</text>
  <text x="640" y="194" text-anchor="middle" font-size="10" fill="#ffffff" opacity="0.7">理解 · 推理 · 规划</text>

  <!-- 执行单元 -->
  <rect x="780" y="110" width="140" height="96" rx="10" fill="#ffffff" stroke="#d9dee7" stroke-width="1.5"/>
  <text x="850" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#2b3445">执行单元</text>
  <text x="850" y="175" text-anchor="middle" font-size="10.5" fill="#8a94a6">执行器 · 动作输出</text>

  <!-- 内部流转箭头 -->
  <line x1="492" y1="158" x2="548" y2="158" stroke="#9aa5b5" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="732" y1="158" x2="778" y2="158" stroke="#9aa5b5" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 记忆与知识体系 -->
  <rect x="470" y="330" width="360" height="150" rx="12" fill="#f5f9ff" stroke="#7ea4f0" stroke-width="1.5"/>
  <text x="650" y="360" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2563eb">记忆与知识体系</text>
  <rect x="490" y="376" width="155" height="84" rx="8" fill="#ffffff" stroke="#c7d9f8"/>
  <text x="567" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b3445">短期记忆</text>
  <text x="567" y="426" text-anchor="middle" font-size="10" fill="#8a94a6">上下文记忆</text>
  <text x="567" y="444" text-anchor="middle" font-size="10" fill="#8a94a6">多轮交互与中间状态</text>
  <rect x="665" y="376" width="155" height="84" rx="8" fill="#ffffff" stroke="#c7d9f8"/>
  <text x="742" y="404" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b3445">长期记忆</text>
  <text x="742" y="426" text-anchor="middle" font-size="10" fill="#8a94a6">知识库</text>
  <text x="742" y="444" text-anchor="middle" font-size="10" fill="#8a94a6">历史数据与用户偏好</text>

  <!-- 决策核心 <-> 记忆 双向箭头 -->
  <line x1="640" y1="218" x2="640" y2="328" stroke="#2563eb" stroke-width="2" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="656" y="278" font-size="10" fill="#2563eb">读写</text>
</svg>
