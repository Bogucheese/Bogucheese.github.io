<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LZH 的个人作品集：开发项目展示，记录用代码构建的想法。">
  <meta name="keywords" content="作品集, 项目展示, 前端, 后端, AI 应用">
  <title>LZH 作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <header class="site-header">
    <div class="header-container">
      <a class="logo" href="index.html">作品集<span class="logo-dot">.</span></a>
      <nav class="header-nav" id="headerNav">
        <a class="nav-link active" href="index.html" data-filter="">全部项目</a>
        <!-- 分类由 JS 根据项目数据渲染 -->
      </nav>
      <div class="header-links">
        <a class="nav-link" href="https://lzhcodeblog.site" target="_blank" rel="noopener">博客 ↗</a>
        <a class="nav-link header-github" id="githubLink" href="#" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar-left" id="sidebar">
      <!-- 个人资料卡 / 分类 / 技能 / 最新项目 由 JS 渲染 -->
    </aside>

    <main class="content-right">
      <section class="hero">
        <p class="hero-kicker"><span class="clay-dot"></span>SELECTED WORKS</p>
        <h1 class="hero-title">用代码构建的想法</h1>
        <p class="hero-subtitle">这里收录了我做过的开发项目——从 Web 应用到 AI Agent，每一个都从想法落地为可运行的作品。</p>
      </section>

      <div class="filter-bar">
        <div class="filter-chips" id="filterChips">
          <button class="filter-chip active" data-filter="">全部</button>
          <!-- 其余分类 chip 由 JS 渲染 -->
        </div>
        <span class="filter-count" id="filterCount"></span>
      </div>

      <div class="project-grid" id="projectGrid"></div>

      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-title">这个分类下还没有项目</p>
        <p class="empty-desc">把项目 Markdown 文件放进 projects/ 目录，运行 <code>node build.js</code> 即可发布。</p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-main">
        <div class="footer-brand">
          <p class="footer-title">LZH 作品集<span class="logo-dot">.</span></p>
          <p class="footer-desc">记录每一个从想法到落地的项目。</p>
        </div>
        <nav class="footer-nav">
          <a href="index.html">全部项目</a>
          <a href="https://lzhcodeblog.site" target="_blank" rel="noopener">我的博客</a>
          <a id="footerGithub" href="#" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
      <p class="footer-copyright">
        © <span id="copyrightYear"></span> LZH · 暖纸设计 · 与博客同源的设计体系
      </p>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="回到顶部">↑</button>

  <script src="js/marked.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
